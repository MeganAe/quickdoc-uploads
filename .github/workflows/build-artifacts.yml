name: Build Android APK & Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://huwitbpebnnqaanzcacd.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable__WmduMwOUsyuUr8XPkBTgA_0iGrECaC' }}
        run: |
          npm run build
          npm run prepare:dist

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          mkdir -p android/app/src/main/res/drawable
          cp public/ic_logo.xml android/app/src/main/res/drawable/ic_logo.xml || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickDoc-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-windows-exe:
    name: Build Windows EXE (Electron)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install electron electron-builder --save-dev --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://huwitbpebnnqaanzcacd.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable__WmduMwOUsyuUr8XPkBTgA_0iGrECaC' }}
        run: |
          npm run build
          npm run prepare:dist

      - name: Package Windows EXE
        run: npx electron-builder --config electron-builder.json --win --x64 --publish never

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickDoc-Windows-EXE
          path: release/*.exe
          retention-days: 14
